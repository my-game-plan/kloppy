# The MGP fork's CI. test.yml is upstream's and only runs on master, so
# without this nothing tested mgp-fork/* and red tests went unnoticed.
# Python 3.11 because that is what pipelines/ runs this fork on.
name: MGP fork tests

on:
  push:
    branches:
    - 'mgp-fork/**'
  pull_request:
    branches:
    - 'mgp-fork/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    - name: Test with pytest
      run: pytest --color=yes -p no:warnings kloppy/tests
